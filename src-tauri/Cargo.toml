[package]
name = "epub-annotation-bridge"
version = "0.1.0"
description = "A local annotation ledger for sideloaded EPUBs"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "epub_annotation_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
notify = "8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
